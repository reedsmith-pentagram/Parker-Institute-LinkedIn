<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parker Institute — LinkedIn Post Generator</title>
<style>
/*FONTS*/
:root { --ink: #000; --mute: #767676; --rule: #e6e6e6; --wash: #f5f5f3; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 400 13px/1.45 "PI Caslon", Georgia, serif; color: var(--ink); background: #fff; opacity: 0; transition: opacity .2s; }
body.ready { opacity: 1; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
header { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--rule); }
header .title { letter-spacing: .01em; }
header .sub { color: var(--mute); }
.app { display: grid; grid-template-columns: 380px 1fr; height: calc(100% - 52px); }
aside { border-right: 1px solid var(--rule); overflow-y: auto; padding: 8px 24px 40px; }
.step, #content { padding: 18px 0 20px; border-bottom: 1px solid var(--rule); }
#content { border-bottom: 0; }
.step.locked { color: var(--mute); }
.step-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.step.locked .step-head { margin-bottom: 0; }
.num { width: 14px; color: var(--mute); }
.label { flex: 1; }
.value { color: var(--mute); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; padding-left: 24px; }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 6px; border: 1px solid transparent; }
.opt:hover { border-color: var(--rule); }
.opt.on { border-color: var(--ink); }
.opt span { padding-left: 1px; }
.opt.soon { cursor: default; color: var(--mute); }
.opt.soon:hover { border-color: transparent; }
.soon-box { width: 64px; height: 64px; display: grid; place-items: center; background: var(--wash); font-size: 11px; text-align: center; }
.thumb { display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.hint { color: var(--mute); margin: 6px 0 0; width: 100%; }
.field { padding-left: 24px; margin-bottom: 18px; }
.field > label { display: block; margin-bottom: 6px; }
.case { color: var(--mute); }
textarea { width: 100%; font: 400 13px/1.45 "PI Caslon", Georgia, serif; color: var(--ink); border: 1px solid var(--rule); padding: 8px 10px; resize: vertical; outline: none; border-radius: 0; }
textarea:focus { border-color: var(--ink); }
.meta { display: flex; gap: 12px; margin-top: 4px; color: var(--mute); font-size: 12px; }
.count.over, .note { color: #b00020; }
.note:empty { display: none; }
.img-row { display: flex; align-items: baseline; gap: 14px; padding: 7px 0; border-top: 1px solid var(--rule); }
.img-row:last-of-type { border-bottom: 1px solid var(--rule); }
.img-name { flex: 1; display: flex; gap: 10px; min-width: 0; }
.img-name .file { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.img-name .file.muted { color: var(--mute); }
.link { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.stage { display: flex; flex-direction: column; min-width: 0; background: var(--wash); }
.canvas-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#preview { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.06); }
#overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; overflow: visible; touch-action: none; }
#overlay.drop { outline: 2px solid var(--ink); outline-offset: 4px; }
#overlay .guide { fill: none; stroke: #ff2d75; stroke-dasharray: 6 6; opacity: .55; }
#overlay .hover { fill: none; stroke: #0a84ff; opacity: .8; }
#overlay .hover.dot { stroke: #ff2d75; }
#overlay .sel { fill: none; stroke: #0a84ff; }
#overlay .handle { fill: #fff; stroke: #0a84ff; }
.btn.ghost.on { background: var(--wash); }
#manual-panel { position: sticky; top: -8px; z-index: 2; background: #fff; padding: 18px 0 14px; border-bottom: 1px solid var(--rule); }
.tips summary { cursor: pointer; color: var(--mute); margin-bottom: 6px; }
.tips ul { margin: 6px 0 0; padding-left: 16px; }
.manual-head { display: flex; gap: 16px; align-items: baseline; margin-bottom: 10px; }
.manual-head .label { flex: 1; }
.link:disabled { color: var(--mute); text-decoration: none; cursor: default; }
.tips { margin: 0 0 14px; padding-left: 16px; color: var(--mute); }
.tips li { margin-bottom: 4px; }
.ctl { padding: 12px 0; border-top: 1px solid var(--rule); }
.ctl-title { margin-bottom: 8px; }
.ctl .row { display: flex; gap: 16px; align-items: baseline; padding: 4px 0; }
.ctl .row > span { flex: 1; color: var(--mute); }
.slider { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 10px; margin-bottom: 8px; }
.slider input { width: 100%; accent-color: #000; }
.slider .val { text-align: right; color: var(--mute); }
.bar { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-top: 1px solid var(--rule); background: #fff; }
#preview-caption { flex: 1; color: var(--mute); }
#status { color: var(--mute); }
.btn { border: 1px solid var(--ink); padding: 8px 16px; background: var(--ink); color: #fff; }
.btn.ghost { background: #fff; color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.bar-top { display: flex; padding: 12px 24px; color: var(--mute); }
</style>
</head>
<body>
<header>
  <span class="title">Parker Institute&ensp;LinkedIn Post Generator</span>
  <span class="sub">Choose a layout, add your words and images, export a PNG.</span>
</header>
<div class="app">
  <aside>
    <div id="manual-panel" hidden></div>
    <div id="steps"></div>
    <div id="content" hidden></div>
  </aside>
  <section class="stage">
    <div class="canvas-wrap"><canvas id="preview" hidden></canvas><svg id="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg></div>
    <div class="bar">
      <span id="preview-caption">Choose a post type to begin.</span>
      <span id="status"></span>
      <button class="btn ghost" id="undo" data-undo disabled title="⌘Z / Ctrl+Z">Undo</button>
      <button class="btn" id="export" disabled>Export PNG</button>
    </div>
  </section>
</div>

<script>

</body>
</html>
